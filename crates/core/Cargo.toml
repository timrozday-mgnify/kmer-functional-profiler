[package]
name = "kmer-functional-profiler-core"
description = "Kernels: FASTX streaming, translation, amino-acid k-mers, hashing, samplers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# no "zstd": needletail 0.7.3 pins zstd 0.13, open advisories RUSTSEC-2026-0391/0398/0403
needletail = { version = "0.7.3", default-features = false, features = [
  "flate2",
] }
thiserror = "2.0.21"

[dev-dependencies]
proptest = "1.11.0"
