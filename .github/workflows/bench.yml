name: Bench

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest tests/bench --benchmark-json bench.json
      - uses: actions/upload-artifact@v4
        with:
          name: bench
          path: bench.json
