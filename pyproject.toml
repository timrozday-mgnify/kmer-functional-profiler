[project]
name = "kmer-functional-profiler"
version = "0.1.0"
description = "Protein k-mer functional profiling of metagenomes"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.5.5",
  "numpy",
  "polars>=1.44.2",
  "pyarrow>=25.0.1",
  "scipy>=1.17.1",
  "sourmash>=4.9.4",
  "typer",
]

[project.scripts]
kmer-functional-profiler = "kmer_functional_profiler.cli:app"

[dependency-groups]
bench = ["insilicoseq>=2.0.1", "mappy>=2.31"]
dev = [
  "hypothesis",
  "maturin",
  "mypy",
  "pytest",
  "pytest-benchmark>=5.3.0",
  "ruff",
  "scipy-stubs>=1.17.1.5",
]

[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "crates/py/Cargo.toml"
python-source = "python"
module-name = "kmer_functional_profiler._core"
features = ["pyo3/extension-module"]
profile = "release"

[tool.uv]
default-groups = [
  "dev",
  "bench",
] # bench: workflows/fmh-benchmark (InSilicoSeq, minimap2)
# Rebuild the extension when Rust sources change.
cache-keys = [
  { file = "pyproject.toml" },
  { file = "Cargo.toml" },
  { file = "crates/**/Cargo.toml" },
  { file = "crates/**/*.rs" },
]

[tool.ruff]
target-version = "py311"
src = ["python"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[[tool.mypy.overrides]]
module = ["sourmash", "screed"]
ignore_missing_imports = true
