[workspace]
resolver = "3"
members = ["crates/core", "crates/py"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/timrozday-mgnify/kmer-functional-profiler"

[workspace.dependencies]
kmer-functional-profiler-core = { path = "crates/core" }
pyo3 = "0.29"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
